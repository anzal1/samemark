<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">
<title id="t">Total time to stream an answer, full re-parse per push versus samemark/stream</title>
<desc id="d">Line chart with three measured answer lengths. 10,451 characters: full re-parse 422 ms, samemark/stream 66 ms, 6.4x; 30,416 characters: full re-parse 981 ms, samemark/stream 54 ms, 18.2x; 100,193 characters: full re-parse 9,232 ms, samemark/stream 133 ms, 69.4x. Full re-parse grows faster than linearly, the stream parser stays near flat.</desc>
<text x="24" y="28" fill="#1f2328" font-size="17" font-weight="600" text-anchor="start">Cost of streaming an answer, by answer length</text><text x="24" y="49" fill="#59636e" font-size="13" font-weight="400" text-anchor="start">Total time to push the whole answer in 12 character chunks, parser only (lower is better)</text><rect x="24" y="66" width="10" height="10" rx="1.5" fill="#6a737d"/><text x="40" y="76" fill="#1f2328" font-size="13" font-weight="400" text-anchor="start">full re-parse on every push</text><rect x="252.3" y="66" width="10" height="10" rx="1.5" fill="#1a7f64"/><text x="268.3" y="76" fill="#1f2328" font-size="13" font-weight="400" text-anchor="start">samemark/stream (createStreamParser)</text><line x1="200" y1="322" x2="800" y2="322" stroke="#818b98" stroke-width="1"/><text x="192" y="326" fill="#59636e" font-size="12" font-weight="400" text-anchor="end">0</text><line x1="200" y1="280" x2="800" y2="280" stroke="#d1d9e0" stroke-width="1"/><text x="192" y="284" fill="#59636e" font-size="12" font-weight="400" text-anchor="end">2,000</text><line x1="200" y1="238" x2="800" y2="238" stroke="#d1d9e0" stroke-width="1"/><text x="192" y="242" fill="#59636e" font-size="12" font-weight="400" text-anchor="end">4,000</text><line x1="200" y1="196" x2="800" y2="196" stroke="#d1d9e0" stroke-width="1"/><text x="192" y="200" fill="#59636e" font-size="12" font-weight="400" text-anchor="end">6,000</text><line x1="200" y1="154" x2="800" y2="154" stroke="#d1d9e0" stroke-width="1"/><text x="192" y="158" fill="#59636e" font-size="12" font-weight="400" text-anchor="end">8,000</text><line x1="200" y1="112" x2="800" y2="112" stroke="#d1d9e0" stroke-width="1"/><text x="192" y="116" fill="#59636e" font-size="12" font-weight="400" text-anchor="end">10,000</text><text x="24" y="98" fill="#59636e" font-size="12" font-weight="400" text-anchor="start">ms</text><polyline points="257,313.1 365.9,301.4 746.5,128.1" fill="none" stroke="#6a737d" stroke-width="2" stroke-linejoin="round"/><circle cx="257" cy="313.1" r="3.5" fill="#6a737d"/><circle cx="365.9" cy="301.4" r="3.5" fill="#6a737d"/><circle cx="746.5" cy="128.1" r="3.5" fill="#6a737d"/><polyline points="257,320.6 365.9,320.9 746.5,319.2" fill="none" stroke="#1a7f64" stroke-width="2" stroke-linejoin="round"/><circle cx="257" cy="320.6" r="3.5" fill="#1a7f64"/><circle cx="365.9" cy="320.9" r="3.5" fill="#1a7f64"/><circle cx="746.5" cy="319.2" r="3.5" fill="#1a7f64"/><text x="742.5" y="116.1" fill="#1f2328" font-size="12" font-weight="400" text-anchor="end">9,232 ms</text><text x="742.5" y="307.2" fill="#1f2328" font-size="12" font-weight="400" text-anchor="end">133 ms</text><line x1="257" y1="322" x2="257" y2="327" stroke="#818b98" stroke-width="1"/><line x1="365.9" y1="322" x2="365.9" y2="327" stroke="#818b98" stroke-width="1"/><line x1="746.5" y1="322" x2="746.5" y2="327" stroke="#818b98" stroke-width="1"/><text x="24" y="352" fill="#59636e" font-size="12" font-weight="400" text-anchor="start">answer length</text><text x="257" y="352" fill="#59636e" font-size="12" font-weight="400" text-anchor="middle">10,451 chars</text><text x="365.9" y="352" fill="#59636e" font-size="12" font-weight="400" text-anchor="middle">30,416 chars</text><text x="746.5" y="352" fill="#59636e" font-size="12" font-weight="400" text-anchor="middle">100,193 chars</text><rect x="24" y="366" width="10" height="10" rx="1.5" fill="#6a737d"/><text x="40" y="376" fill="#1f2328" font-size="12" font-weight="400" text-anchor="start">full re-parse</text><text x="257" y="376" fill="#1f2328" font-size="12" font-weight="400" text-anchor="middle">422 ms</text><text x="365.9" y="376" fill="#1f2328" font-size="12" font-weight="400" text-anchor="middle">981 ms</text><text x="746.5" y="376" fill="#1f2328" font-size="12" font-weight="400" text-anchor="middle">9,232 ms</text><rect x="24" y="390" width="10" height="10" rx="1.5" fill="#1a7f64"/><text x="40" y="400" fill="#1f2328" font-size="12" font-weight="400" text-anchor="start">samemark/stream</text><text x="257" y="400" fill="#1f2328" font-size="12" font-weight="400" text-anchor="middle">66 ms</text><text x="365.9" y="400" fill="#1f2328" font-size="12" font-weight="400" text-anchor="middle">54 ms</text><text x="746.5" y="400" fill="#1f2328" font-size="12" font-weight="400" text-anchor="middle">133 ms</text><text x="24" y="424" fill="#1f2328" font-size="12" font-weight="400" text-anchor="start">speedup</text><text x="257" y="424" fill="#1f2328" font-size="12" font-weight="600" text-anchor="middle">6.4x</text><text x="365.9" y="424" fill="#1f2328" font-size="12" font-weight="600" text-anchor="middle">18.2x</text><text x="746.5" y="424" fill="#1f2328" font-size="12" font-weight="600" text-anchor="middle">69.4x</text><text x="24" y="471" fill="#59636e" font-size="11.5" font-weight="400" text-anchor="start">Source: bench/stream-bench.mjs in CI (ubuntu-latest, private development repo), numbers as published in the README.</text><text x="24" y="486" fill="#59636e" font-size="11.5" font-weight="400" text-anchor="start">Three measured sizes; the lines only connect the points.</text>
</svg>
