<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">
<title id="t">Total time to stream an answer, full re-parse per push versus samemark/stream</title>
<desc id="d">Line chart with three measured answer lengths. 10,451 characters: full re-parse 422 ms, samemark/stream 66 ms, 6.4x; 30,416 characters: full re-parse 981 ms, samemark/stream 54 ms, 18.2x; 100,193 characters: full re-parse 9,232 ms, samemark/stream 133 ms, 69.4x. Full re-parse grows faster than linearly, the stream parser stays near flat.</desc>
<text x="24" y="28" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="start">Cost of streaming an answer, by answer length</text><text x="24" y="49" fill="#9198a1" font-size="13" font-weight="400" text-anchor="start">Total time to push the whole answer in 12 character chunks, parser only (lower is better)</text><rect x="24" y="66" width="10" height="10" rx="1.5" fill="#9aa4b2"/><text x="40" y="76" fill="#e6edf3" font-size="13" font-weight="400" text-anchor="start">full re-parse on every push</text><rect x="271.2" y="66" width="10" height="10" rx="1.5" fill="#3fb68b"/><text x="287.2" y="76" fill="#e6edf3" font-size="13" font-weight="400" text-anchor="start">samemark/stream (createStreamParser)</text><line x1="200" y1="322" x2="720" y2="322" stroke="#6e7681" stroke-width="1"/><text x="192" y="326" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">0</text><line x1="200" y1="280" x2="720" y2="280" stroke="#30363d" stroke-width="1"/><text x="192" y="284" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">2,000</text><line x1="200" y1="238" x2="720" y2="238" stroke="#30363d" stroke-width="1"/><text x="192" y="242" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">4,000</text><line x1="200" y1="196" x2="720" y2="196" stroke="#30363d" stroke-width="1"/><text x="192" y="200" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">6,000</text><line x1="200" y1="154" x2="720" y2="154" stroke="#30363d" stroke-width="1"/><text x="192" y="158" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">8,000</text><line x1="200" y1="112" x2="720" y2="112" stroke="#30363d" stroke-width="1"/><text x="192" y="116" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">10,000</text><text x="24" y="98" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">ms</text><polyline points="249.4,313.1 343.8,301.4 673.6,128.1" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linejoin="round"/><circle cx="249.4" cy="313.1" r="3.5" fill="#9aa4b2"/><circle cx="343.8" cy="301.4" r="3.5" fill="#9aa4b2"/><circle cx="673.6" cy="128.1" r="3.5" fill="#9aa4b2"/><polyline points="249.4,320.6 343.8,320.9 673.6,319.2" fill="none" stroke="#3fb68b" stroke-width="2" stroke-linejoin="round"/><circle cx="249.4" cy="320.6" r="3.5" fill="#3fb68b"/><circle cx="343.8" cy="320.9" r="3.5" fill="#3fb68b"/><circle cx="673.6" cy="319.2" r="3.5" fill="#3fb68b"/><text x="669.6" y="116.1" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="end">9,232 ms</text><text x="669.6" y="307.2" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="end">133 ms</text><line x1="249.4" y1="322" x2="249.4" y2="327" stroke="#6e7681" stroke-width="1"/><line x1="343.8" y1="322" x2="343.8" y2="327" stroke="#6e7681" stroke-width="1"/><line x1="673.6" y1="322" x2="673.6" y2="327" stroke="#6e7681" stroke-width="1"/><text x="24" y="352" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">answer length</text><text x="249.4" y="352" fill="#9198a1" font-size="12" font-weight="400" text-anchor="middle">10,451 chars</text><text x="343.8" y="352" fill="#9198a1" font-size="12" font-weight="400" text-anchor="middle">30,416 chars</text><text x="673.6" y="352" fill="#9198a1" font-size="12" font-weight="400" text-anchor="middle">100,193 chars</text><rect x="24" y="366" width="10" height="10" rx="1.5" fill="#9aa4b2"/><text x="40" y="376" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="start">full re-parse</text><text x="249.4" y="376" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="middle">422 ms</text><text x="343.8" y="376" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="middle">981 ms</text><text x="673.6" y="376" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="middle">9,232 ms</text><rect x="24" y="390" width="10" height="10" rx="1.5" fill="#3fb68b"/><text x="40" y="400" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="start">samemark/stream</text><text x="249.4" y="400" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="middle">66 ms</text><text x="343.8" y="400" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="middle">54 ms</text><text x="673.6" y="400" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="middle">133 ms</text><text x="24" y="424" fill="#e6edf3" font-size="12" font-weight="400" text-anchor="start">speedup</text><text x="249.4" y="424" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">6.4x</text><text x="343.8" y="424" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">18.2x</text><text x="673.6" y="424" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">69.4x</text><text x="24" y="471" fill="#9198a1" font-size="11.5" font-weight="400" text-anchor="start">Source: bench/stream-bench.mjs in CI (ubuntu-latest, private development repo), numbers as published in the README.</text><text x="24" y="486" fill="#9198a1" font-size="11.5" font-weight="400" text-anchor="start">Three measured sizes; the lines only connect the points.</text>
</svg>
