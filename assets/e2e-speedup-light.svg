<svg xmlns="http://www.w3.org/2000/svg" width="880" height="446" viewBox="0 0 880 446" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">
<title id="t">End to end markdown to HTML time, remark-parse versus samemark</title>
<desc id="d">Horizontal bars for six inputs. node-api-docs: remark-parse 5.00 s, samemark 486 ms, 10.3x faster; node-changelog-v22: remark-parse 1.33 s, samemark 171 ms, 7.8x faster; rust-book: remark-parse 1.07 s, samemark 125 ms, 8.6x faster; vite-docs: remark-parse 570 ms, samemark 73 ms, 7.8x faster; react-changelog: remark-parse 498 ms, samemark 71 ms, 7.0x faster; synthetic corpus (240 generated documents): remark-parse 546 ms, samemark 89 ms, 6.2x faster. Source: bench workflow run 38036885270.</desc>
