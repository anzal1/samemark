<svg xmlns="http://www.w3.org/2000/svg" width="880" height="462" viewBox="0 0 880 462" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">
<title id="t">Main-thread time streaming a 30,000 character answer into the DOM</title>
<desc id="d">Grouped horizontal bars, one panel per CPU throttle level. No throttling: (a) react-markdown 11.29 s, (b) react-markdown + samemark 2.24 s, (c) samemark/stream, memoised 187 ms; 4x slower: (a) react-markdown 50.91 s, (b) react-markdown + samemark 9.85 s, (c) samemark/stream, memoised 669 ms; 6x slower: (a) react-markdown 79.43 s, (b) react-markdown + samemark 15.33 s, (c) samemark/stream, memoised 1.03 s. Source: bench workflow run 38036885270.</desc>
