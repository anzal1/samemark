name: demo-capture
# Records the streaming demo in headless, muted Chromium and uploads the capture and the GIF as an artifact. Commits nothing.
# By hand: Actions tab, "Run workflow".
on:
  workflow_dispatch:
    inputs:
      len:
        description: 'answer length (10000 or 30000)'
        default: '10000'
      rate:
        description: 'updates per second (0 = as fast as possible)'
        default: '25'
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node site/build.mjs
      - run: |
          npm i --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: node scripts/record-demo.mjs --out=out --len=${{ inputs.len }} --rate=${{ inputs.rate }}
      - name: GIF size variants (fps, colors, dither)
        run: |
          for v in "10 64 none" "8 48 none" "8 32 none" "6 32 none" "8 32 bayer:bayer_scale=5" "10 48 sierra2_4a"; do
            set -- $v
            ffmpeg -y -loglevel error -ss 0.5 -t 12 -i out/demo.webm -vf "fps=${1},scale=880:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=${2}:stats_mode=diff[p];[b][p]paletteuse=dither=${3}:diff_mode=rectangle" -loop 0 "out/v-${1}fps-${2}c-${3//[:=]/_}.gif"
          done
          ls -l out
      - run: ls -l out
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-capture
          path: out/
